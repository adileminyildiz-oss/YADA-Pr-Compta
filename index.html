<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1120">
<meta name="yada-version" content="3.5.0">
<title>YADA PRO</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ============================================================
   YADA PRO — hub de factures (envoyer / réceptionner)
   Application mono-fichier, autonome, hors-ligne (PWA).
   ============================================================ */
:root{
  --bg:#f7f7f6; --surface:#ffffff; --surface2:#ffffff;
  --line:#eeeeec; --line2:#e4e4e0;
  --txt:#1a1a1a; --muted:#767674; --faint:#aaaaa6;
  --accent:#1a1a1a; --accent2:#1a1a1a; --accent-d:#000000;
  --accent-soft:#f0f0ee; --accent-softer:#f5f5f3;
  --good:#3a833a; --warn:#9a6a10; --bad:#b3402e;
  --radius:12px; --radius-s:8px;
  --shadow:none;
  --shadow-lg:0 12px 40px rgba(0,0,0,.14);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans); color:var(--txt); line-height:1.55;
  background:var(--bg); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;}
a{color:var(--accent2);text-decoration:underline}
a:hover{opacity:.7}
button{font:inherit}

/* coquille */
.app{display:grid; grid-template-columns:236px 1fr; min-height:100dvh}
aside{position:sticky; top:0; height:100dvh; overflow:auto; display:flex; flex-direction:column; gap:2px; padding:22px 14px;
  background:var(--bg); border-right:1px solid var(--line);}
.brand{display:flex; align-items:center; gap:11px; padding:4px 8px 18px}
.brand .name{font-weight:700; font-size:18px; letter-spacing:-.01em; color:var(--txt)}
.brand .sub{display:block; font-size:10.5px; font-weight:600; color:var(--muted); letter-spacing:.16em}
.nav-sec{font-size:10.5px; letter-spacing:.10em; color:var(--faint); text-transform:uppercase; font-weight:600; margin:16px 10px 6px}
.nav-btn{display:flex; align-items:center; gap:11px; width:100%; text-align:left; padding:9px 12px; border-radius:var(--radius-s);
  border:1px solid transparent; background:transparent; color:var(--muted); font-size:14px; font-weight:500; cursor:pointer; transition:.12s;}
.nav-btn:hover{background:var(--accent-softer); color:var(--txt)}
.nav-btn.active{background:var(--accent-soft); color:var(--txt); font-weight:600}
.nav-btn .ico{width:17px; text-align:center; opacity:.7}
.nav-btn .badge{margin-left:auto; font-size:11px; font-weight:600; background:var(--surface); color:var(--muted); border:1px solid var(--line2); border-radius:999px; padding:0 7px}
.nav-list{display:flex; flex-direction:column; gap:2px}
.side-foot{margin-top:auto; padding-top:14px; border-top:1px solid var(--line); color:var(--faint); font-size:11px}

main{padding:36px clamp(18px,4vw,56px); min-width:0}
.page-head{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:28px}
.page-head h1{margin:0; font-size:24px; font-weight:700; letter-spacing:-.02em; text-wrap:balance}
.page-head .spacer{flex:1}
.tag{font-size:11.5px; font-weight:600; border-radius:6px; padding:2px 8px; border:1px solid var(--line2); color:var(--muted); background:var(--surface)}
.t-draft{color:var(--faint)} .t-sent{color:var(--good); border-color:var(--line2)}
.t-todo{color:var(--warn); border-color:var(--line2)}
.t-done{color:var(--good); border-color:var(--line2)}
.t-late{color:var(--bad); border-color:var(--line2)}
.t-att{color:var(--txt); border-color:var(--line2)}
.t-soon{color:var(--warn); border-color:var(--line2)}
.t-ven{color:var(--muted); border-color:var(--line2)}
.t-devis{color:var(--warn); border-color:var(--line2)}
.t-avoir{color:var(--muted); border-color:var(--line2)}
.filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px}
.filt{padding:6px 13px; border-radius:999px; border:1px solid var(--line2); background:var(--surface); color:var(--muted); cursor:pointer; font-size:13px; transition:.12s}
.filt:hover{border-color:var(--txt); color:var(--txt)}
.filt.active{border-color:var(--txt); background:var(--txt); color:#fff; font-weight:500}

.grid{display:grid; gap:18px}
.g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px; box-shadow:var(--shadow);}
.card h2{margin:0 0 14px; font-size:15px; font-weight:600; letter-spacing:-.01em}
.kpi .lbl{font-size:12px; color:var(--muted); letter-spacing:.01em; font-weight:500}
.kpi .val{font-size:27px; font-weight:700; letter-spacing:-.02em; margin-top:6px; font-variant-numeric:tabular-nums; color:var(--txt)}
.kpi .val.blue{color:var(--txt)} .kpi .val.good{color:var(--good)} .kpi .val.warn{color:var(--bad)}

label{display:block; font-size:12.5px; color:var(--muted); font-weight:500; margin:0 0 5px}
input,select,textarea{width:100%; padding:9px 11px; border-radius:var(--radius-s); border:1px solid var(--line2);
  background:var(--surface); color:var(--txt); font:inherit; font-size:14px; transition:border-color .12s, box-shadow .12s;}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--txt); box-shadow:0 0 0 3px rgba(26,26,26,.08)}
input::placeholder,textarea::placeholder{color:var(--faint)}
.field{margin-bottom:12px}
.row{display:grid; gap:12px} .row.c4{grid-template-columns:repeat(4,1fr)} .row.c3{grid-template-columns:repeat(3,1fr)} .row.c2{grid-template-columns:repeat(2,1fr)}
@media(max-width:760px){.row.c4,.row.c3,.row.c2{grid-template-columns:1fr}}

.btn{display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:var(--radius-s); border:1px solid var(--line2);
  background:var(--surface); color:var(--txt); cursor:pointer; font-size:14px; font-weight:500; transition:.12s;}
.btn:hover{border-color:var(--txt)}
.btn-pri{background:var(--txt); border-color:var(--txt); color:#fff; font-weight:500}
.btn-pri:hover{background:var(--accent-d); border-color:var(--accent-d); color:#fff}
.btn-sm{padding:6px 11px; font-size:13px} .btn-ghost{background:transparent; border-color:transparent}
.btn-ghost:hover{background:var(--accent-softer); border-color:transparent; color:var(--txt)}
.btn-danger:hover{border-color:var(--bad); color:var(--bad); background:transparent}
.right{display:flex; justify-content:flex-end; gap:10px; margin-top:8px}
.themes{display:flex; gap:8px; flex-wrap:wrap}
.theme-chip{display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border:1px solid var(--line2); border-radius:999px; background:var(--surface); color:var(--muted); cursor:pointer; font-size:13px; transition:.12s}
.theme-chip:hover{border-color:var(--txt); color:var(--txt)}
.theme-chip.active{border-color:var(--txt); background:var(--txt); color:#fff}
.theme-chip .sw{width:12px; height:12px; border-radius:3px; display:inline-block}
.theme-tag{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted)}
.theme-tag .sw{width:11px; height:11px; border-radius:3px; display:inline-block}
.emwrap{display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start}
@media(max-width:1050px){.emwrap{grid-template-columns:1fr}}
.em-prev{background:#fff; border:1px solid var(--line2); border-radius:10px; overflow:auto; max-height:660px}
.em-prev .inv{zoom:.66}
.em-prev .inv-custom{zoom:.66}
.soc-active{margin:0 6px 6px}
.soc-select{width:100%; padding:9px 11px; border-radius:var(--radius-s); border:1px solid var(--line2); background:var(--surface); color:var(--txt); font-size:13.5px}
.soc-name{font-weight:600; font-size:15px; padding:6px 6px}
.soc-row-act td{background:var(--accent-softer)}
textarea{resize:vertical; min-height:54px}

table{width:100%; border-collapse:collapse; font-size:13.5px}
th{text-align:left; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--faint); font-weight:600; padding:10px; border-bottom:1px solid var(--line2)}
td{padding:12px 10px; border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .1s}
tbody tr:hover td{background:var(--accent-softer)}
td.r,th.r{text-align:right} .num{font-variant-numeric:tabular-nums}
.empty{color:var(--faint); text-align:center; padding:24px}
.mini{font-size:12px;color:var(--muted)}

.lignes{border:1px solid var(--line2); border-radius:var(--radius-s); overflow:hidden; margin-top:6px}
.li-row{display:grid; grid-template-columns:1fr 84px 110px 92px 110px 34px; gap:8px; align-items:center; padding:8px 10px; border-bottom:1px solid var(--line)}
.li-row:last-child{border-bottom:none}
.li-row.head{background:var(--accent-softer); font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--faint)}
.li-row input,.li-row select{padding:8px 10px}
@media(max-width:760px){.li-row{grid-template-columns:1fr 60px 80px 70px 80px 30px; gap:5px}}

.totals{margin-top:14px; margin-left:auto; width:min(320px,100%)}
.totals .l{display:flex; justify-content:space-between; padding:5px 0; color:var(--muted)}
.totals .l.big{border-top:1px solid var(--line2); margin-top:5px; padding-top:9px; color:var(--txt); font-weight:700; font-size:16px}

.drop{border:1px dashed var(--line2); border-radius:var(--radius); padding:28px; text-align:center; color:var(--muted); transition:.12s; cursor:pointer}
.drop.over{border-color:var(--txt); background:var(--accent-softer); color:var(--txt)}

/* toast + modal */
#toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); opacity:0; pointer-events:none;
  background:var(--txt); border:1px solid var(--txt); color:#fff; padding:11px 18px; border-radius:10px; box-shadow:var(--shadow-lg); transition:.25s; z-index:60; font-size:14px}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.modal-bg{position:fixed; inset:0; background:rgba(26,26,26,.4); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50}
.modal{background:var(--surface); border:1px solid var(--line2); border-radius:var(--radius); max-width:820px; width:100%; max-height:90dvh; overflow:auto; box-shadow:var(--shadow-lg)}
.modal-h{display:flex; align-items:center; justify-content:space-between; padding:15px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--surface)}
.modal-b{padding:20px}
#yada-ver{position:fixed; left:12px; bottom:8px; font-size:11px; color:var(--faint); z-index:5}
.bars{display:flex; gap:8px; align-items:flex-end; height:180px; padding-top:8px}
.bar-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0}
.bar-wrap{width:100%; height:150px; display:flex; align-items:flex-end; justify-content:center}
.bar{width:60%; min-height:2px; border-radius:4px 4px 0 0; background:var(--txt); transition:height .3s}
.bar-lbl{font-size:11px; color:var(--faint); white-space:nowrap}
.bar-val{font-size:10.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.hbar{display:flex; align-items:center; gap:10px; margin:8px 0}
.hbar .nm{width:130px; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.hbar .tr{flex:1; height:10px; background:var(--accent-soft); border-radius:5px; overflow:hidden}
.hbar .fl{height:100%; background:var(--txt); border-radius:5px}
.hbar .vl{width:92px; text-align:right; font-size:12.5px; font-variant-numeric:tabular-nums}

@media(max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:sticky; top:0; z-index:30; height:auto; flex-direction:column; gap:8px; padding:9px 12px 8px; border-right:none; border-bottom:1px solid var(--line)}
  .side-top{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .brand{padding:0}
  .side-top .soc-wrap{flex:0 1 55%; min-width:0}
  .soc-wrap .nav-sec{display:none}
  .soc-active{margin:0}
  .nav-sec-fac,.side-foot{display:none}
  .nav-list{flex-direction:row; overflow-x:auto; gap:6px; padding-bottom:2px; -webkit-overflow-scrolling:touch}
  .nav-btn{flex:0 0 auto; white-space:nowrap; padding:8px 13px}
  main{padding:18px 14px 46px}
  .card{padding:16px 15px}
  .page-head h1{font-size:21px}
  .em-prev .inv{zoom:.46}
  .em-prev{max-height:none}
}
/* ---- Zone d'impression (facture PDF) ---- */
#print-area{display:none}
@media print{
  body{background:#fff}
  .app,#toast,#yada-ver,.modal-bg{display:none !important}
  #print-area{display:block !important}
  #print-area .inv-break{page-break-after:always}
  #print-area .inv-break.inv-last{page-break-after:auto}
}
.inv{--ia:#0a64d6; --ihbg:#eef4ff; --ihtx:#33507a; --iband:transparent; --ico:#0a64d6;
  color:#0b1220; font-size:13px; max-width:780px; margin:0 auto; padding:36px 40px; background:#fff; font-family:var(--sans)}
.inv .h{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid var(--ia); padding-bottom:16px; margin-bottom:22px}
.inv .h .co{font-size:20px; font-weight:800; color:var(--ico)}
.inv .h .ti{text-align:right}
.inv .h .ti .big{font-size:22px; font-weight:800}
.inv .parties{display:flex; justify-content:space-between; gap:20px; margin-bottom:20px}
.inv .parties .b{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#5a6b86}
.inv table{width:100%; border-collapse:collapse; font-size:12.5px}
.inv th{background:var(--ihbg); color:var(--ihtx); text-transform:uppercase; font-size:10.5px; padding:8px; text-align:left}
.inv th.r{text-align:right}
.inv td{border-bottom:1px solid #e3e9f2; padding:8px; color:#0b1220}
.inv .tot{margin-left:auto; width:260px; margin-top:14px}
.inv .tot .l{display:flex; justify-content:space-between; padding:4px 0}
.inv .tot .l.big{border-top:2px solid var(--ia); margin-top:5px; padding-top:8px; font-weight:800; font-size:15px}
.inv .foot{margin-top:26px; font-size:11px; color:#5a6b86; border-top:1px solid #e3e9f2; padding-top:10px}
.inv .inv-note{margin-top:16px; font-size:11.5px; color:#334155; border-left:3px solid var(--ia); padding-left:11px}

/* Thèmes de facture */
.inv.th-emeraude{--ia:#059669; --ihbg:#e7f6ef; --ihtx:#1c6b50; --ico:#059669}
.inv.th-indigo{--ia:#6366f1; --ihbg:#ecedff; --ihtx:#4548b8; --ico:#6366f1}
.inv.th-minimal{--ia:#111827; --ihbg:#f3f4f6; --ihtx:#374151; --ico:#111827}
.inv.th-minimal .h .co{letter-spacing:.14em; text-transform:uppercase; font-size:16px}
.inv.th-minimal th{letter-spacing:.08em}
/* Thème « bandeau » : en-tête plein couleur */
.inv.th-bandeau{--ia:#1e3a8a; --ihbg:#e8ecfb; --ihtx:#26407e; padding:0}
.inv.th-bandeau .h{background:var(--ia); color:#fff; padding:26px 40px 22px; margin-bottom:0; border-bottom:none}
.inv.th-bandeau .h .co,.inv.th-bandeau .h .ti,.inv.th-bandeau .h .ti *{color:#fff}
.inv .body{display:contents}
.inv.th-bandeau .body{display:block; padding:24px 40px 36px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="print-area"></div>
<div id="toast"></div>
<span id="yada-ver">YADA PRO · v3.5</span>

<script>
'use strict';
var VERSION='3.5.0';

/* ---------- Données (localStorage) ---------- */
function seed(){ return { societes:[], societeActive:null, contacts:[], emises:[], recues:[], catalogue:[], seq:{fac:0} }; }
var db = load() || seed();
function load(){ try{ return JSON.parse(localStorage.getItem('yadapro')||'null'); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem('yadapro', JSON.stringify(db)); return true; }catch(e){ return false; } }

/* ---------- Utilitaires ---------- */
function uid(){ return 'x'+Math.random().toString(36).slice(2,10); }
function r2(n){ return Math.round((+n||0)*100)/100; }
function eur(n){ return (r2(n)).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'; }
var DEVISES=[{code:'EUR',sym:'€'},{code:'USD',sym:'$'},{code:'GBP',sym:'£'},{code:'CHF',sym:'CHF'},{code:'CAD',sym:'$CA'}];
function devSym(code){ var d=DEVISES.filter(function(x){return x.code===code;})[0]; return d?d.sym:'€'; }
function money(n, code){ return (r2(n)).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+devSym(code||'EUR'); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function frDate(s){ if(!s) return '—'; var p=String(s).split('-'); return p.length===3? p[2]+'/'+p[1]+'/'+p[0] : s; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove('show'); },2600); }
function nextNum(soc, type){ soc=soc||societeActiveObj(); var base=type==='devis'?'DEV':type==='avoir'?'AV':'FAC';
  var code=(soc&&soc.prefixe)?String(soc.prefixe).trim().toUpperCase().replace(/[^A-Z0-9]/g,'')+'-':'';
  var year=new Date().getFullYear();
  var max=0; (db.emises||[]).forEach(function(f){ if(soc && f.societeId!==soc.id) return; var m=String(f.numero||'').match(/-(\d{4})-(\d+)$/); if(m && +m[1]===year){ var n=+m[2]; if(n>max) max=n; } });
  var n=max+1; if(soc) soc.seq=Math.max(soc.seq||0, n);
  return code+base+'-'+year+'-'+String(n).padStart(4,'0'); }
function contact(id){ return db.contacts.find(function(c){ return c.id===id; }); }

/* ---------- Sociétés (multi-société) ---------- */
function societeActiveObj(){ return (db.societes||[]).filter(function(s){return s.id===db.societeActive;})[0] || (db.societes||[])[0] || null; }
function societeOf(f){ return (db.societes||[]).filter(function(s){return s.id===f.societeId;})[0] || societeActiveObj(); }
function emisesActives(){ return db.emises.filter(function(f){ return f.societeId===db.societeActive; }); }
function ensureSocietes(){
  if(!db.catalogue) db.catalogue=[];
  if(!db.societes) db.societes=[];
  if(!db.societes.length){ db.societes.push({ id:uid(), nom:'Ma société', adresse:'', siret:'', tva:'', email:'', tel:'', iban:'', logo:'', theme:'classique', customFormat:'', seq:(db.seq&&db.seq.fac)||0 }); }
  db.societes.forEach(function(s){ if(s.seq==null) s.seq=0; if(!s.theme) s.theme='classique'; });
  if(!db.societeActive || !societeActiveObj()) db.societeActive=db.societes[0].id;
  /* rattacher les factures existantes (sans société) à la société active */
  db.emises.forEach(function(f){ if(!f.societeId) f.societeId=db.societeActive; });
}
function setSocieteActive(id){ db.societeActive=id; emResetDraft(); save(); render(); toast('Société active : '+((societeActiveObj()||{}).nom||'')); }

/* Thèmes d'habillage de la facture de vente */
var THEMES=[
  {id:'classique', nom:'Classique', col:'#0a64d6'},
  {id:'bandeau',   nom:'Bandeau',   col:'#1e3a8a'},
  {id:'emeraude',  nom:'Émeraude',  col:'#059669'},
  {id:'indigo',    nom:'Indigo',    col:'#6366f1'},
  {id:'minimal',   nom:'Minimal',   col:'#111827'}
];
var THEME_NOM={}; THEMES.forEach(function(t){ THEME_NOM[t.id]=t.nom; });
function themeChips(activeId, onclick){ return '<div class="themes">'+THEMES.map(function(t){
  return '<button type="button" class="theme-chip'+(t.id===activeId?' active':'')+'" onclick="'+onclick+'(\''+t.id+'\')"><span class="sw" style="background:'+t.col+'"></span>'+t.nom+'</button>'; }).join('')+'</div>'; }

/* ---------- Marque ---------- */
function yadaMark(px){ px=px||36; var id='g'+uid();
  return '<svg width="'+px+'" height="'+px+'" viewBox="0 0 48 48" style="border-radius:11px;box-shadow:0 3px 10px rgba(0,0,0,.16)">'
   +'<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#333333"/><stop offset="1" stop-color="#111111"/></linearGradient></defs>'
   +'<rect x="1" y="1" width="46" height="46" rx="13" fill="url(#'+id+')"/>'
   +'<path d="M14 14 L24 26 L34 14 M24 26 L24 35" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>'
   +'<circle cx="35.5" cy="33.5" r="3" fill="#3a833a"/></svg>'; }

/* ---------- Navigation ---------- */
var NAV=[
  {id:'dash', ico:'▦', label:'Tableau de bord'},
  {id:'emises', ico:'➤', label:'Envoyer'},
  {id:'suivi', ico:'⏱', label:'Suivi'},

function dansPeriode(dateStr, per){ if(!per||per==='tout') return true; if(!dateStr) return false;
  var d=String(dateStr).split('-'); if(d.length<2) return false; var y=+d[0], m=+d[1];
  var t=todayStr().split('-'); var ty=+t[0], tm=+t[1];
  if(per==='annee') return y===ty;
  if(per==='mois') return y===ty && m===tm;
  if(per==='trimestre') return y===ty && Math.ceil(m/3)===Math.ceil(tm/3);
  return true; }
function periodeLabel(per){ return per==='annee'?'année en cours':per==='trimestre'?'trimestre en cours':per==='mois'?'mois en cours':'toutes périodes'; }
function dashSetPeriode(v){ window.dashPeriode=v; render(); }
function pageDash(){
  var per=window.dashPeriode||'tout';

  var recues=db.recues.filter(function(x){return dansPeriode(x.date,per);});
  var totTTC=r2(em.reduce(function(a,f){return a+ (f.ttc||0);},0));
  var enc=r2(em.reduce(function(a,f){return a+factRegle(f);},0));
  var reste=r2(em.reduce(function(a,f){return a+factReste(f);},0));
  var retard=em.filter(function(f){return factPaie(f).key==='retard';});
  var ech7=em.filter(function(f){ var j=joursEch(f); return factReste(f)>0.005 && j!=null && j>=0 && j<=7; });
  var recuesTodo=db.recues.filter(function(r){return r.statut!=='traitee';});
  var depenses=r2(recues.reduce(function(a,x){return a+(+x.montant||0);},0));
  var tvaCol=r2(em.reduce(function(a,f){return a+(+f.tva||0);},0));
  var tvaDed=r2(recues.reduce(function(a,x){return a+(+x.tva||0);},0));
  var tvaSolde=r2(tvaCol-tvaDed);
  var soc=societeActiveObj()||{};

  var perSel='<select onchange="dashSetPeriode(this.value)" title="Période des indicateurs" style="width:auto;min-width:170px">'+perOpts.map(function(o){return '<option value="'+o[0]+'"'+(per===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select>';

    +kpi('Encaissé', eur(enc), 'good', '')
    +kpi('Reste dû', eur(reste), (reste>0?'warn':''), (retard.length?retard.length+' en retard':'à jour ✓')+(ech7.length?' · '+ech7.length+' à échoir ≤7j':''))
    +'</div>'
    +'<div class="grid g2" style="margin-top:16px">'
    +'<div class="card"><h2>À encaisser en priorité</h2>'+miniListReste(emAll)+'</div>'
    +'<div class="card"><h2>À traiter (reçues) — '+recuesTodo.length+'</h2>'+miniListRecues(recuesTodo.slice(-5).reverse())+'</div>'

    +kpiInline('TVA collectée (ventes)', eur(tvaCol))
    +kpiInline('TVA déductible (achats)', eur(tvaDed))

function emFactures(){ return emisesActives().filter(function(f){ return (f.type||'facture')==='facture'; }); }
function factRegle(f){ return r2((+f.acompte||0) + (f.encaissements||[]).reduce(function(a,e){return a+(+e.montant||0);},0)); }
function factReste(f){ return r2((f.ttc||0)-factRegle(f)); }
function factPaie(f){ var regle=factRegle(f), reste=factReste(f);
  if(reste<=0.005) return {key:'paye', regle:regle, reste:0, label:'payée', cls:'t-done'};
  if(f.statut==='envoyee' && f.ech && todayStr()>f.ech) return {key:'retard', regle:regle, reste:reste, label:'en retard', cls:'t-late'};
  if(regle>0.005) return {key:'partiel', regle:regle, reste:reste, label:'partielle', cls:'t-todo'};
  return {key:'attente', regle:regle, reste:reste, label:'à encaisser', cls:'t-att'};
}
function suiviFiltrer(k){ window.suiviFiltre=k; render(); }
function joursEch(f){ if(!f.ech) return null; var p=String(f.ech).split('-'), t=todayStr().split('-'); if(p.length!==3) return null; var d1=new Date(+p[0],+p[1]-1,+p[2]), d0=new Date(+t[0],+t[1]-1,+t[2]); return Math.round((d1-d0)/86400000); }
function pageSuivi(){

  var kFact=r2(all.reduce(function(a,o){return a+(o.f.ttc||0);},0));
  var kEnc=r2(all.reduce(function(a,o){return a+o.p.regle;},0));
  var kReste=r2(all.reduce(function(a,o){return a+o.p.reste;},0));
  var kRetard=all.filter(function(o){return o.p.key==='retard';}).length;
  var estEcheant=function(o){ var j=joursEch(o.f); return o.p.reste>0.005 && j!=null && j>=0 && j<=7; };
  var counts={tous:all.length, attente:all.filter(function(o){return o.p.key==='attente'||o.p.key==='partiel';}).length, echeant:all.filter(estEcheant).length, retard:kRetard, paye:all.filter(function(o){return o.p.key==='paye';}).length};
  var shown=all.filter(function(o){ if(filt==='tous')return true; if(filt==='retard')return o.p.key==='retard'; if(filt==='attente')return o.p.key==='attente'||o.p.key==='partiel'; if(filt==='echeant')return estEcheant(o); if(filt==='paye')return o.p.key==='paye'; return true; });
  var rows=shown.map(function(o){ var f=o.f, p=o.p, c=contact(f.contactId);
    var j=joursEch(f); var echInd='';
    if(p.reste>0.005 && j!=null){ if(j<0) echInd=' <span class="tag t-late">'+(-j)+' j</span>'; else if(j<=7) echInd=' <span class="tag t-soon">dans '+j+' j</span>'; }
    var act='<button class="btn btn-ghost btn-sm" onclick="emApercu(\''+f.id+'\')">Aperçu</button> ';

    if(p.key==='retard') act+='<button class="btn btn-sm" title="Relancer par e-mail" onclick="factRelance(\''+f.id+'\')">Relancer</button>';
    return '<tr><td><b>'+esc(f.numero)+'</b></td><td>'+esc(c?c.nom:'—')+'</td><td class="num">'+frDate(f.ech)+echInd+'</td>'
      +'<td class="r num">'+money(f.ttc,f.devise)+'</td><td class="r num">'+money(p.regle,f.devise)+'</td><td class="r num"><b>'+money(p.reste,f.devise)+'</b></td>'
      +'<td><span class="tag '+p.cls+'">'+p.label+'</span></td><td class="r" style="white-space:nowrap">'+act+'</td></tr>'; }).join('');
  var chip=function(k,l){ return '<button class="filt'+(filt===k?' active':'')+'" onclick="suiviFiltrer(\''+k+'\')">'+l+' ('+counts[k]+')</button>'; };
  return '<main>'+ph('Suivi des paiements', '<span class="badge">'+esc((societeActiveObj()||{}).nom||'')+'</span>')
    +'<div class="grid g3">'
    +kpi('Facturé (TTC)', eur(kFact), 'blue', '')
    +kpi('Encaissé', eur(kEnc), 'good', '')

    +'</div>'
    +'<div class="card" style="margin-top:16px">'
    +'<div class="filters">'+chip('tous','Toutes')+chip('attente','À encaisser')+chip('echeant','À échoir ≤7j')+chip('retard','En retard')+chip('paye','Payées')+'</div>'
    +'<div style="overflow-x:auto"><table><thead><tr><th>Numéro</th><th>Client</th><th>Échéance</th><th class="r">TTC</th><th class="r">Réglé</th><th class="r">Reste</th><th>Statut</th><th class="r">Actions</th></tr></thead>'

}
function factEncaisser(id){ var f=db.emises.filter(function(x){return x.id===id;})[0]; if(!f)return; var reste=factReste(f);
  openModal('Encaisser — '+esc(f.numero),

var RELANCE_SUJET_DEF='Relance — facture {{numero}}';

function relanceVars(f){ var c=contact(f.contactId)||{}; var soc=societeOf(f)||{}; var reste=factReste(f); var jr=joursEch(f);
  return { '{{client}}':c.nom||'', '{{numero}}':f.numero||'', '{{echeance}}':frDate(f.ech)||'', '{{reste}}':money(reste,f.devise).replace('€','EUR'),

function emDupliquer(id){ var f=db.emises.find(function(x){return x.id===id;}); if(!f)return; var n=JSON.parse(JSON.stringify(f)); n.id=uid(); n.numero=nextNum(null,n.type); n.statut='brouillon'; n.dateEnvoi=null; n.cree=Date.now(); n.encaissements=[]; n.transformeEn=null; db.emises.push(n); save(); render(); toast('Document dupliqué → '+n.numero); }

function emTotaux(){ var htBrut=0,tvaBrut=0; (emDraft.lignes||[]).forEach(function(l){ var b=r2((+l.qte||0)*(+l.pu||0)); htBrut+=b; tvaBrut+=b*(+l.taux||0)/100; });
  htBrut=r2(htBrut); tvaBrut=r2(tvaBrut);
  var rem = emDraft.remiseType==='percent' ? htBrut*(+emDraft.remiseVal||0)/100 : (+emDraft.remiseVal||0);
  rem = r2(Math.min(Math.max(rem,0), htBrut));
  var htNet=r2(htBrut-rem); var ratio = htBrut>0 ? htNet/htBrut : 1; var tva=r2(tvaBrut*ratio); var ttc=r2(htNet+tva);

  var acompte = emDraft.type==='facture' ? r2(Math.min(Math.max(+emDraft.acompte||0,0), ttc)) : 0;
  return { htBrut:r2(htBrut*signe), remise:r2(rem*signe), ht:r2(htNet*signe), tva:r2(tva*signe), ttc:r2(ttc*signe), acompte:acompte, net:r2(ttc*signe-acompte) }; }
function emSync(){ (emDraft.lignes||[]).forEach(function(l,i){

function emListeFiltree(){

  var list=base.filter(function(f){ if(st!=='tous' && st!=='archive' && docStatutFilt(f)!==st) return false;

  list.sort(function(a,b){ var va,vb;

function recListe(){
  var q=(window.recQuery||'').toLowerCase().trim(); var cat=window.recCat||'Toutes';
  var all=db.recues.slice().sort(function(a,b){return b.cree-a.cree;});
  var list=all.filter(function(r){ if(cat!=='Toutes' && (r.categorie||'')!==cat) return false;
    if(!q)return true; return (r.fournisseur||'').toLowerCase().indexOf(q)>=0 || (r.nomFichier||'').toLowerCase().indexOf(q)>=0; });
  var rows=list.map(function(r){
    var tg = r.statut==='traitee' ? '<span class="tag t-done">traitée</span>' : '<span class="tag t-todo">à traiter</span>';
    var voir = r.fichier ? '<button class="btn btn-ghost btn-sm" onclick="recVoir(\''+r.id+'\')">Voir</button> ' : '';
    var mark = r.statut==='traitee' ? '<button class="btn btn-ghost btn-sm" onclick="recStatut(\''+r.id+'\',\'todo\')">Rouvrir</button>'
                                    : '<button class="btn btn-pri btn-sm" onclick="recStatut(\''+r.id+'\',\'traitee\')">Marquer traitée</button>';
    return '<tr><td>'+esc(r.fournisseur||'—')+(r.nomFichier?'<div class="mini">'+esc(r.nomFichier)+'</div>':'')+'</td>'
      +'<td class="mini">'+esc(r.categorie||'—')+'</td>'
      +'<td class="num">'+frDate(r.date)+'</td><td class="r num">'+eur(r.montant)+'</td><td class="r num">'+eur(r.tva||0)+'</td><td>'+tg+'</td>'
      +'<td class="r" style="white-space:nowrap">'+voir+mark+' <button class="btn btn-ghost btn-sm btn-danger" onclick="recSuppr(\''+r.id+'\')">✕</button></td></tr>'; }).join('');
  var search='<input id="rec-search" placeholder="Rechercher (fournisseur, fichier)…" value="'+esc(window.recQuery||'')+'" oninput="recFiltrer(this.value)" style="max-width:260px">';
  var chips=['Toutes'].concat(CATS_ACHAT).map(function(k){ return '<button class="filt'+(cat===k?' active':'')+'" onclick="recCatSet(\''+k+'\')">'+k+'</button>'; }).join('');
  return '<div class="card" style="margin-top:16px"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px"><h2 style="margin:0">Boîte de réception ('+all.length+')</h2><div style="flex:1"></div>'+search+'</div>'
    +'<div class="filters">'+chips+'</div>'
    +'<div style="overflow-x:auto"><table><thead><tr><th>Fournisseur</th><th>Catégorie</th><th>Date</th><th class="r">TTC</th><th class="r">dont TVA</th><th>Statut</th><th class="r">Actions</th></tr></thead>'
    +'<tbody>'+(rows||'<tr><td colspan="7" class="empty">'+(q||cat!=='Toutes'?'Aucun résultat.':'Aucune facture reçue.')+'</td></tr>')+'</tbody></table></div></div>';

var recPending=null; /* {nomFichier, fichier(dataURL|null)} */
function recFichier(input){ var file=input.files&&input.files[0]; if(!file)return;
  var fn=document.getElementById('rec-fname'); fn.textContent='Lecture de « '+file.name+' »…';
  var rd=new FileReader();
  rd.onload=function(){ recPending={ nomFichier:file.name, fichier:(file.size<1500000? rd.result : null) };
    fn.innerHTML='Fichier : <b>'+esc(file.name)+'</b>'+(recPending.fichier?'':' <span style="color:var(--warn)">(trop volumineux : non conservé, seules les infos seront enregistrées)</span>'); };
  rd.onerror=function(){ recPending={ nomFichier:file.name, fichier:null }; fn.textContent='Fichier : '+file.name+' (aperçu indisponible)'; };
  rd.readAsDataURL(file);
}
var CATS_ACHAT=['Achats','Sous-traitance','Frais généraux','Matériel','Déplacements','Autre'];
function recAjouter(){
  var four=(document.getElementById('rec-four').value||'').trim();
  var date=document.getElementById('rec-date').value||todayStr();
  var mont=+document.getElementById('rec-mont').value||0;
  var tva=+document.getElementById('rec-tva').value||0;
  var cat=(document.getElementById('rec-cat')||{}).value||'Autre';
  if(!four && !recPending) return toast('Indiquez au moins un fournisseur ou un fichier.');
  var r={ id:uid(), fournisseur:four, date:date, montant:r2(mont), tva:r2(tva), categorie:cat, statut:'todo', cree:Date.now(),
    nomFichier:recPending?recPending.nomFichier:null, fichier:recPending?recPending.fichier:null };
  db.recues.push(r);
  if(!save()){ r.fichier=null; save(); toast('Enregistré, mais le fichier était trop volumineux pour le stockage local.'); }
  else toast('Facture reçue enregistrée.');
  recPending=null; render();

/* Glisser-déposer */
function bindDrop(){ var d=document.getElementById('drop'); if(!d)return;
  ['dragenter','dragover'].forEach(function(e){ d.addEventListener(e,function(ev){ ev.preventDefault(); d.classList.add('over'); }); });
  ['dragleave','drop'].forEach(function(e){ d.addEventListener(e,function(ev){ ev.preventDefault(); d.classList.remove('over'); }); });
  d.addEventListener('drop',function(ev){ var f=ev.dataTransfer&&ev.dataTransfer.files&&ev.dataTransfer.files[0]; if(f){ var inp=document.getElementById('rec-file'); var dt=new DataTransfer(); dt.items.add(f); inp.files=dt.files; recFichier(inp); } });
}

function emAjoutCat(id){ var a=(db.catalogue||[]).filter(function(x){return x.id===id;})[0]; if(!a)return; emSync();

   ============================================================ */
function moisDerniers(n){ var arr=[]; var now=new Date(); for(var i=n-1;i>=0;i--){ var d=new Date(now.getFullYear(), now.getMonth()-i, 1);
  arr.push({ key:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'), label:String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getFullYear()).slice(2) }); } return arr; }
function pageStats(){ var soc=societeActiveObj()||{}; var facs=emFactures();
  var caTot=r2(facs.reduce(function(a,f){return a+(f.ttc||0);},0));
  var enc=r2(facs.reduce(function(a,f){return a+factRegle(f);},0));
  var panier=facs.length?r2(caTot/facs.length):0;
  var mois=moisDerniers(12);
  var parMois=mois.map(function(m){ var v=facs.filter(function(f){return String(f.date||'').indexOf(m.key)===0;}).reduce(function(a,f){return a+(f.ttc||0);},0); return {label:m.label, value:r2(v)}; });
  var maxM=Math.max.apply(null, [1].concat(parMois.map(function(d){return d.value;})));
  var barsHTML=parMois.map(function(d){ var h=Math.round(d.value/maxM*100); return '<div class="bar-col"><div class="bar-val">'+(d.value?Math.round(d.value):'')+'</div><div class="bar-wrap"><div class="bar" style="height:'+h+'%" title="'+d.label+' : '+eur(d.value)+'"></div></div><div class="bar-lbl">'+d.label+'</div></div>'; }).join('');
  var byC={}; facs.forEach(function(f){ byC[f.contactId]=(byC[f.contactId]||0)+(f.ttc||0); });
  var top=Object.keys(byC).map(function(id){ return {nom:(contact(id)||{}).nom||'—', v:r2(byC[id])}; }).sort(function(a,b){return b.v-a.v;}).slice(0,6);
  var maxC=Math.max(1, top.length?top[0].v:1);
  var topHTML=top.length? top.map(function(t){ return '<div class="hbar"><div class="nm">'+esc(t.nom)+'</div><div class="tr"><div class="fl" style="width:'+Math.round(t.v/maxC*100)+'%"></div></div><div class="vl">'+eur(t.v)+'</div></div>'; }).join('') : '<div class="empty">Aucune facture pour cette société.</div>';
  return '<main>'+ph('Statistiques', '<span class="badge">'+esc(soc.nom||'')+'</span>')
    +'<div class="grid g3">'
    +kpi('CA total (TTC)', eur(caTot), 'blue', facs.length+' facture(s)')
    +kpi('Encaissé', eur(enc), 'good', '')
    +kpi('Panier moyen', eur(panier), '', '')
    +'</div>'
    +'<div class="card" style="margin-top:16px"><h2>Chiffre d\'affaires — 12 derniers mois</h2><div style="overflow-x:auto"><div class="bars" style="min-width:520px">'+barsHTML+'</div></div></div>'
    +'<div class="card" style="margin-top:16px"><h2>Top clients (CA facturé)</h2>'+topHTML+'</div>'
    +'</main>';
}
var PAGES={ dash:pageDash, emises:pageEmises, suivi:pageSuivi, stats:pageStats, recues:pageRecues, contacts:pageContacts, catalogue:pageCatalogue, societes:pageSocietes, donnees:pageDonnees };
function render(){ document.getElementById('app').innerHTML=sidebar()+(PAGES[current]||pageDash)(); if(current==='recues') bindDrop(); }

if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
ensureSocietes(); save(); render();
</script>
